[project]
name = "rag-enterprise-assistant"
version = "0.1.0"
description = "Production-style RAG assistant for enterprise documents"
authors = [
    { name = "Sagar", email = "sagarpatel151098@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115.0",
    "pymupdf>=1.24.10",
    "psycopg2-binary>=2.9.9",
    "python-docx>=1.2.0",
]

[project.scripts]
rag-enterprise-assistant = "rag_enterprise_assistant:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"
